<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>רשימת קניות חכמה</title>
<style>
:root { --bg:#0f0f10; --surface:#18181b; --gold:#d4a843; --text:#e8e8ed; --border:#2a2a32; }
body { font-family: system-ui; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
.wrap { max-width: 500px; margin: 0 auto; }
header { display: flex; gap: 10px; margin-bottom: 20px; }
select, input { background: var(--surface); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; }
select { flex: 1; }
.btn { background: var(--gold); border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <select id="list-selector" onchange="switchList()"></select>
    <button class="btn" onclick="addList()">+</button>
    <button class="btn" onclick="delList()">🗑️</button>
  </header>

  <div style="background:var(--surface); padding:20px; border-radius:14px;">
    <div style="display:flex; gap:10px;">
      <input id="new-item" style="flex:1" placeholder="מוצר חדש...">
      <button class="btn" onclick="addItem()">הוסף</button>
    </div>
    <div id="list-area"></div>
  </div>
</div>

<script>
  let db = JSON.parse(localStorage.getItem('db')) || { "קניות": [] };
  let active = localStorage.getItem('active') || "קניות";

  function save() { localStorage.setItem('db', JSON.stringify(db)); localStorage.setItem('active', active); render(); }
  
  function render() {
    const sel = document.getElementById('list-selector');
    sel.innerHTML = Object.keys(db).map(n => `<option value="${n}" ${n===active?'selected':''}>${n}</option>`).join('');
    
    document.getElementById('list-area').innerHTML = db[active].map((item, i) => `
      <div class="item ${item.d ? 'done':''}">
        <input type="checkbox" ${item.d ? 'checked':''} onchange="toggle(${i})">
        <span style="flex:1">${item.t}</span>
        <span onclick="rem(${i})" style="color:red; cursor:pointer">X</span>
      </div>
    `).join('');
  }

  function switchList() { active = document.getElementById('list-selector').value; render(); }
  function addList() { const n = prompt("שם רשימה:"); if(n && !db[n]) { db[n] = []; active = n; save(); } }
  function delList() { if(Object.keys(db).length>1) { delete db[active]; active = Object.keys(db)[0]; save(); } else alert("אי אפשר למחוק אחרונה!"); }
  function addItem() { const i = document.getElementById('new-item'); if(i.value) { db[active].push({t:i.value, d:false}); i.value=''; save(); } }
  function toggle(i) { db[active][i].d = !db[active][i].d; save(); }
  function rem(i) { db[active].splice(i,1); save(); }

  render();
</script>
</body>
</html>
